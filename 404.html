<!DOCTYPE html>
<html lang="en" data-ui-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Alejandra Zerdá</title>
    <link rel="icon" href="/assets/img/favicon.ico" />
    <script>
      (function () {
        var r = document.documentElement, l = null, t = null;
        try { l = localStorage.getItem("az-lang"); t = localStorage.getItem("az-theme"); } catch (e) {}
        if (l !== "es" && l !== "en") l = /^es\b/i.test(navigator.language || "") ? "es" : "en";
        r.setAttribute("data-ui-lang", l);
        r.setAttribute("lang", l);
        if (t === "dark" || t === "light") r.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/site.css" />
    <style>
      .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
      .nf-emoji { font-size: 4rem; line-height: 1; }
      .nf h1 { margin-top: 18px; font-size: 2rem; }
      .nf p { margin-top: 8px; color: var(--muted); }
      .nf .btn { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main class="nf">
      <div>
        <div class="nf-emoji" aria-hidden="true">🦀</div>
        <h1><span data-lang="en">This page doesn't exist</span><span data-lang="es">Esta página no existe</span></h1>
        <p><span data-lang="en">The link may be broken or the page may have moved.</span><span data-lang="es">Puede que el enlace esté roto o que la página se haya movido.</span></p>
        <a class="btn btn-primary" href="/"><span data-lang="en">Back to home</span><span data-lang="es">Volver al inicio</span></a>
      </div>
    </main>
  </body>
</html>
